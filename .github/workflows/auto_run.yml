name: BeThoMo 24/7 Handover Engine

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

# Chỉ 1 run active trong group. GitHub giữ tối đa 1 run đang chờ và tự huỷ
# run chờ cũ hơn, nên cron 5 phút chỉ hoạt động như watchdog, không chồng ca.
concurrency:
  group: bethomo-engine
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install requests telethon
      - name: Run 24/7 Engine
        env:
          PYTHONUNBUFFERED: "1"
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: nthanhhung0122-max/bethomo
          TELEGRAM_ACCOUNTS_JSON: ${{ secrets.TELEGRAM_ACCOUNTS_JSON }}
          UNBAN_EMAIL: ${{ secrets.UNBAN_EMAIL }}
        run: python run_all.py
